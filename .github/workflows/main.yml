name: Compile Snake Game

on:
  push:
    branches:
      - main
      - feature/snk-sr-001-input-validation
      - feature/game-core
      - feature/pause-and-game-over
  pull_request:

jobs:
  compile:
    # The game uses <windows.h> and <conio.h>, so it only builds on Windows.
    runs-on: windows-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Compile Snake Game
        shell: bash
        run: |
          gcc -Wall -Wextra -pedantic -std=c11 -Iinclude \
            src/main.c src/input.c src/game.c src/render.c \
            -o snake_game.exe
